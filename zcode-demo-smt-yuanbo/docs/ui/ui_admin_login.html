<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 云ERP教程中心·管理后台</title>
<style>
:root{
  --primary:#0066ff; --cta:#f97316; --success:#16a34a; --danger:#dc2626; --warn:#d97706;
  --gray:#64748b; --border:#e2e8f0; --bg:#f8fafc; --bg2:#f1f5f9; --card:#fff; --radius:12px; --dark:#0f172a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--dark);color:#0f172a;font-size:14px;position:relative;overflow:hidden;
}
/* 背景装饰 */
.bg-glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
.bg-glow.g1{width:520px;height:520px;background:#0066ff;top:-180px;left:-140px}
.bg-glow.g2{width:420px;height:420px;background:#f97316;bottom:-160px;right:-120px;opacity:.22}
.bg-grid{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;
}
.login-wrap{position:relative;z-index:1;width:408px;max-width:calc(100vw - 32px)}
/* 品牌区 */
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
.brand-logo{
  width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0066ff,#3b82f6);color:#fff;font-size:30px;
  box-shadow:0 12px 32px rgba(0,102,255,.4);margin-bottom:14px;
}
.brand-name{color:#fff;font-size:22px;font-weight:600;letter-spacing:1px}
.brand-sub{
  margin-top:8px;color:#94a3b8;font-size:13px;display:flex;align-items:center;gap:8px;
}
.brand-sub::before,.brand-sub::after{content:'';width:36px;height:1px;background:rgba(148,163,184,.35)}
/* 登录卡片 */
.login-card{
  background:var(--card);border-radius:var(--radius);padding:34px 32px 28px;
  box-shadow:0 24px 64px rgba(2,6,23,.55);
}
.login-card h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
.login-card .sub{text-align:center;color:var(--gray);font-size:12px;margin-bottom:24px}
.form-item{margin-bottom:16px}
.form-item label{display:block;font-size:13px;color:#334155;font-weight:500;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap .lead-ico{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:#94a3b8;line-height:1;
}
.input{
  width:100%;height:44px;border:1px solid var(--border);border-radius:8px;
  padding:0 12px 0 38px;font-size:14px;color:#0f172a;background:#fff;
  transition:border-color .15s, box-shadow .15s;font-family:inherit;
}
.input::placeholder{color:#94a3b8}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,102,255,.12)}
.eye{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:#94a3b8;font-size:14px;padding:4px;line-height:1;
}
.eye:hover{color:var(--gray)}
/* 错误提示 */
.error-tip{
  display:none;align-items:center;gap:6px;background:#fef2f2;border:1px solid #fecaca;color:var(--danger);
  border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:14px;
}
.error-tip.show{display:flex}
/* 登录按钮 */
.btn-login{
  width:100%;height:46px;border:none;border-radius:8px;background:var(--primary);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;
  transition:background .15s, transform .05s;
}
.btn-login:hover{background:#0052cc}
.btn-login:active{transform:scale(.985);background:#0047b3}
/* 演示账号提示 */
.demo-account{
  margin-top:18px;border:1px dashed var(--border);background:var(--bg2);
  border-radius:8px;padding:10px 12px;font-size:12px;color:var(--gray);line-height:1.7;text-align:center;
}
.demo-account b{color:#334155;font-weight:600}
.demo-account .code{color:var(--primary);font-weight:600}
.login-foot{margin-top:22px;text-align:center;color:#64748b;font-size:12px;opacity:.75}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>

<div class="login-wrap">
  <div class="brand">
    <div class="brand-logo">📚</div>
    <div class="brand-name">云ERP教程中心</div>
    <div class="brand-sub">管理后台</div>
  </div>

  <div class="login-card">
    <h1>管理员登录</h1>
    <div class="sub">账号密码登录 · 两级角色（管理员 / 运营编辑）</div>

    <div class="error-tip" id="errTip">⚠ <span>账号或密码错误</span></div>

    <form id="loginForm" novalidate>
      <div class="form-item">
        <label for="account">账号</label>
        <div class="input-wrap">
          <span class="lead-ico">👤</span>
          <input class="input" id="account" type="text" placeholder="请输入账号" autocomplete="username" value="admin">
        </div>
      </div>
      <div class="form-item">
        <label for="password">密码</label>
        <div class="input-wrap">
          <span class="lead-ico">🔒</span>
          <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" value="123456">
          <button class="eye" type="button" id="eyeBtn" title="显示/隐藏密码">👁</button>
        </div>
      </div>
      <button class="btn-login" type="submit">登 录</button>
    </form>

    <div class="demo-account">
      演示账号 <span class="code">admin / 123456</span> 或 <span class="code">operator / 123456</span><br>
      admin 为平台管理员（审核/发布/看板）· operator 为运营编辑（建稿/提审，登录后仅见「教程管理」+「看板」只读，按角色显隐菜单）<br>
      前台 / 小程序「选角色快速登录」（销售/采购/生产/仓库/管理/财务 6 角色卡）已内嵌于 portal 与 m 端页面顶栏，无需本页登录
    </div>
  </div>

  <div class="login-foot">云ERP教程中心 · 演示环境 · 仅用于原型演示</div>
</div>

<script>
// 密码可见切换
document.getElementById('eyeBtn').addEventListener('click', function () {
  var pwd = document.getElementById('password');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
});
// 登录校验：演示账号 admin/123456 或 operator/123456，错误统一提示"账号或密码错误"
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var acc = document.getElementById('account').value.trim();
  var pwd = document.getElementById('password').value.trim();
  var ok = (acc === 'admin' && pwd === '123456') || (acc === 'operator' && pwd === '123456');
  var tip = document.getElementById('errTip');
  if (!ok) { tip.classList.add('show'); return; }
  tip.classList.remove('show');
  // 通过后进入统计看板（operator 角色进入教程管理）
  location.href = acc === 'admin' ? 'ui_admin_dashboard.html' : 'ui_admin_tutorial_list.html';
});
</script>
</body>
</html>
